services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: politech
      POSTGRES_PASSWORD: politech
      POSTGRES_DB: politech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politech"]
      interval: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://politech:politech@db:5432/politech
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-at-least-32-bytes}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      UPLOAD_FOLDER: /app/uploads
      SEED: "1"
    ports:
      - "5001:5000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
