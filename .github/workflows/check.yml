name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: politech
          POSTGRES_PASSWORD: politech
          POSTGRES_DB: politech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U politech -d politech_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://politech:politech@localhost:5432/politech_test
      TEST_DATABASE_URL: postgresql+psycopg://politech:politech@localhost:5432/politech_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
